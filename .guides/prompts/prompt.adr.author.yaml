$schema: ../schemas/prompt.schema.json
apiVersion: guided-engineering/v1
id: adr.author
version: 2
title: Record an architecture decision as an ADR at the moment it is made
agent: guided-engineer

objective: |
  One new Architecture Decision Record under `.guides/architecture/adr/` states
  the decision, the forces behind it, its consequences, and the alternatives
  that were rejected. Its front matter validates against the ADR schema.

context: |
  An ADR is cheap to write (a few hundred words) and is not rewritten once
  `accepted`; a later decision supersedes it. Write one for a decision with
  structural reach: stack changes, data model shifts, public contracts, security
  posture, cross-cutting conventions. A decision that can be reversed inside a
  single pull request usually does not need one.

  Decisions made implicitly during implementation turn into knowledge that only
  some people hold. Capturing one at decision time costs minutes; reconstructing
  it months later costs days. The alternatives are the part most often skipped
  and most often needed.

  An ADR file is Markdown with a YAML front-matter block. The front matter is
  the contract (`.guides/schemas/adr.schema.json`); the body is the readable
  record. The file name is the `adrId` plus `.md`, and the `adrId` is the next
  free four-digit number followed by a short kebab-case title.

inputs:
  - .guides/schemas/adr.schema.json
  - .guides/architecture/adr/

dependencies:
  - The decision itself, from the human who made it or from the discussion where it was made.

constraints:
  - Record the decision that was made; do not make one. Ask when the decision or its reason is unclear.
  - 'Use `status: proposed` when a human still has to accept the decision and `status: accepted` only when a human already did.'
  - Do not edit the content of an existing ADR, except to mark it superseded.

steps:
  - id: frame
    title: Frame the decision
    actions:
      - State the decision in one sentence in active voice ("We will use X for Y because Z").
      - Identify the forces in play (constraints, deadlines, regulation, performance, cost, team skill).

  - id: alternatives
    title: Enumerate the alternatives
    actions:
      - List at least one credible alternative; "keep the current approach" often is one.
      - State in one sentence why each alternative was rejected.

  - id: consequences
    title: State the consequences
    actions:
      - List what becomes easier and what becomes harder.
      - State how reversible the decision is and what would have to change if it is superseded.

  - id: write
    title: Write the ADR file
    actions:
      - List `.guides/architecture/adr/` and take the next free four-digit prefix.
      - Write `.guides/architecture/adr/<adrId>.md` with the front matter first and the same content in prose below it.
      - 'When the new ADR supersedes an earlier one, set `status: superseded` and `supersededBy: <adrId>` in the earlier file and change nothing else in it.'

  - id: validate
    title: Validate the result
    actions:
      - Run `npm run validate` and correct the new file until its front matter is valid.

output:
  - file: .guides/architecture/adr/<adrId>.md
    rules:
      - The file name matches `^[0-9]{4}-[a-z0-9-]+\.md$` and equals the `adrId` plus `.md`.
      - The front matter validates against `.guides/schemas/adr.schema.json`.
      - '`alternativesConsidered` lists at least one alternative.'
      - The body repeats context, decision, consequences and alternatives in prose.

verification:
  - id: front-matter-valid
    expect: Every ADR in the repository, including the new one, has valid front matter.
    run: npm run validate
  - id: decision-is-the-humans
    expect: The recorded decision and its status match what the human decided; nothing was decided by the executor.

stopConditions:
  - The decision, or the reason for it, cannot be established from what the human provided.

tags:
  - adr
  - architecture
createdBy: guided-engineering
