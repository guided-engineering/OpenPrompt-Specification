$schema: ../schemas/prompt.schema.json
apiVersion: guided-engineering/v1
id: operation.commit-analyze-and-apply
version: 2
title: Analyze pending changes and record them as one Conventional Commit
agent: guided-engineer

objective: |
  The pending changes of the working tree are recorded in exactly one new commit
  whose subject line follows the Conventional Commits format and describes what
  actually changed. Nothing is pushed.

context: |
  The repository uses Conventional Commits: `<type>(<scope>): <summary>`.
    - type: feat | fix | docs | refactor | chore | test | ci | perf
    - scope: the logical area that changed (for example schemas, prompts, docs, tools)
    - summary: what changed, in plain language, at most 72 characters for the whole subject line
  A commit is a visible, shared side effect. It is made only because a human
  asked for one, and it must contain only the changes that human expects.

dependencies:
  - Git is available and the workspace is a Git working tree.
  - A human asked for the pending changes to be committed.

constraints:
  - Never push, tag, amend, or rewrite existing commits.
  - Never bypass hooks (`--no-verify`) or signing.
  - Do not commit files that look like secrets or local-only data; stop and report them instead.
  - Create one commit. If the changes are unrelated to each other, stop and propose how to split them.

steps:
  - id: inspect-changes
    title: Inspect what is pending
    actions:
      - Run `git status --porcelain` and stop with the message "Nothing to commit." when it prints nothing.
      - Run `git diff` and `git diff --staged` and read the changes, not only the file names.
      - List untracked files and decide for each whether it belongs to the change; stop when one looks like a secret, a credential, or unrelated work.

  - id: classify
    title: Choose type and scope from the content of the change
    actions:
      - Choose the type from what the diff does (new behavior is feat, a corrected defect is fix, documentation only is docs, no behavior change is refactor, tooling or housekeeping is chore).
      - Choose the scope from the area most of the change touches; omit the scope when no single area fits.
      - Stop and propose a split when the diff contains changes that need different types and do not depend on each other.

  - id: commit
    title: Create the commit
    actions:
      - 'Write a subject line `<type>(<scope>): <summary>` of at most 72 characters that states what changed.'
      - Add a body only when the reason for the change is not obvious from the diff.
      - Stage the files that belong to the change by name and create one commit.

  - id: verify
    title: Verify the recorded commit
    actions:
      - Run `git log -1 --pretty=%s` and compare the subject with the format.
      - Run `git show --stat HEAD` and confirm the commit contains exactly the intended files.
      - Run `git diff --quiet HEAD` and report any tracked change that is still uncommitted.

output: []

verification:
  - id: subject-format
    expect: 'The subject of `HEAD` matches `<type>(<scope>): <summary>` with an allowed type and is at most 72 characters long.'
  - id: content-matches
    expect: '`git show --stat HEAD` lists exactly the files that were pending and intended for this commit.'
  - id: nothing-left
    expect: No tracked file has uncommitted changes.
    run: git diff --quiet HEAD

stopConditions:
  - There is nothing to commit.
  - A pending file looks like a secret, a credential, or work unrelated to the request.
  - The pending changes cannot be described truthfully by one commit.
  - A hook rejects the commit; report its output instead of bypassing it.

tags:
  - operation
  - git
  - conventional-commits
createdBy: guided-engineering
